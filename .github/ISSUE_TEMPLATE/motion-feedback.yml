name: Motion feedback
description: A movement, transition, contact or camera observation
title: "Motion feedback: "
body:
  - type: input
    id: scene
    attributes:
      label: Scene or motion
      description: Page/tab plus take or motion ID and seed, or paste the page URL
    validations:
      required: true
  - type: input
    id: character
    attributes:
      label: Character and control preset
      placeholder: "C08 / B-REK43 / EVA-K7 / Meshy; Hybrid or Lab when applicable"
  - type: input
    id: time
    attributes:
      label: Timestamp
      placeholder: "For example: 0:45"
  - type: textarea
    id: observation
    attributes:
      label: What did you notice?
      description: A useful detail, an awkward movement or something that worked well
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and browser
